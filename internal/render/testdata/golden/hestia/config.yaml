model:
  provider: custom:modelgate
  default: gpt-5.6-luna
  max_tokens: 32768
  context_length: 400000
providers:
  modelgate:
    api: https://llm.snowballsh.com/v1
    key_env: FARM_MODELGATE_KEY
    transport: chat_completions
agent:
  reasoning_effort: xhigh
auxiliary:
  approval:
    provider: modelgate
    model: gpt-5.6-luna
    reasoning_effort: low
  background_review:
    provider: modelgate
    model: gpt-5.6-luna
    reasoning_effort: low
  compression:
    provider: modelgate
    model: gpt-5.6-luna
    reasoning_effort: low
  curator:
    provider: modelgate
    model: gpt-5.6-luna
    reasoning_effort: low
  kanban_decomposer:
    provider: modelgate
    model: gpt-5.6-luna
    reasoning_effort: low
  title_generation:
    provider: modelgate
    model: gpt-5.6-luna
    reasoning_effort: low
  triage_specifier:
    provider: modelgate
    model: gpt-5.6-luna
    reasoning_effort: low
  vision:
    provider: modelgate
    model: gpt-5.6-luna
    reasoning_effort: low
toolsets:
  - kanban
  - terminal
  - file
  - web
  - memory
  - vision
  - skills
  - mcp-google-calendar
terminal:
  backend: local
  cwd: /var/lib/farm/hestia
display:
  tool_progress: log
kanban:
  dispatch_in_gateway: false
  review_dispatch: false
  auto_decompose: false
  max_in_progress_per_profile: 1
  failure_limit: 2
security:
  allow_lazy_installs: false
  allow_private_urls: true
secrets:
  command:
    enabled: true
    command: /usr/local/bin/snowfarm secret-env
approvals:
  mode: smart
mcp_servers:
  google-calendar:
    command: /usr/bin/node
    args:
      - /usr/local/lib/google-calendar-mcp/build/index.js
      - --enable-tools
      - list-calendars,list-events,search-events,get-event,list-colors,create-event,create-events,get-freebusy,get-current-time
    env:
      GOOGLE_CALENDAR_MCP_TOKEN_PATH: /var/lib/farm/hestia/google/tokens.json
      GOOGLE_OAUTH_CREDENTIALS: /var/lib/farm/hestia/google/client.json
